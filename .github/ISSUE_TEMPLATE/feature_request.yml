name: Solicitud de Funcionalidad (Feature Request)
description: Sugiere una nueva mecánica o mejora para NeaFutbol
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Descripción de la Funcionalidad
      description: ¿Qué nueva característica te gustaría ver?
    validations:
      required: true
  - type: textarea
    id: gameplay
    attributes:
      label: Impacto en el Juego / Mecánica
      description: ¿Cómo mejorará la experiencia de los jugadores o administradores?
