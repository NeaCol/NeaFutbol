name: Solicitud de Funcionalidad (Feature Request)
description: Propuesta de nueva mecánica o mejora técnica para NeaFutbol.
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Descripción de la Funcionalidad
      description: Descripción técnica de la funcionalidad o ajuste propuesto.
    validations:
      required: true
  - type: textarea
    id: gameplay
    attributes:
      label: Impacto en el Juego / Mecánica
      description: Justificación técnica y comportamiento esperado en el juego.
